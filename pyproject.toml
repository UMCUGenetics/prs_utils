[project]
name = "prs-utils"
version = "1.0.0"
description = "Utility commands used by the UMCUGenetics prsutils Nextflow modules."
readme = "README.md"
authors = [
    { name = "Bioinformatica Genetica", email = "bioinformatica-genetica@umcutrecht.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project.scripts]
prs-utils = "prs_utils.cli:cli"

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 127

[tool.uv]
required-version = ">=0.11.28"
package=true
exclude-newer = "7 days"
