[project]
name = "prs-utils"
version = "1.0.0"
description = "Utility commands used by the UMCUGenetics prsutils Nextflow modules."
readme = "README.md"
authors = [
    { name = "Bioinformatica Genetica", email = "bioinformatica-genetica@umcutrecht.nl" },
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[project.scripts]
prs-utils = "prs_utils.cli:cli"

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
extend-select = [
    "A",   # Prevent builtin shadowing
    "ARG", # Detect unused function arguments
    "D",   # Enforce docstring conventions
    "DOC", # Validate docstrings against code
    "DTZ", # Require timezone-aware datetimes
    "E",   # Enforce general Python style
    "ISC", # Detect implicit string concatenation
    "I",   # Enforce import ordering
    "N",   # Enforce PEP 8 naming conventions
    "PD",  # Enforce some opinionated stances about pandas best practices
    "PT",  # Enforce pytest best practices
    "PTH", # Prefer pathlib over os.path
    "Q",   # Enforce consistent quote style
    "SIM", # Simplify code
    "UP",  # Modernize Python code
    "W",   # Enforce whitespace conventions
]

ignore = [
    "RUF100", # Unsafe fix: Removed noqa directives that were still necessary.
    "SIM105", # Explicit try/except can be clearer then contextlib.suppress when exception handling has intentional semantics
    "SIM108", # Ternary expressions can reduce readability for complex or multi-line conditions
    "UP012",  # Explicit string conversion can make the intended type conversion clearer
    "UP015",  # Explicit open modes can make file behavior more obvious
    "UP030",  # Allow implicit and explicit positional references in string formatting.
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
required-version = ">=0.11.28"
package = true
exclude-newer = "7 days"
